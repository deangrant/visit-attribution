name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy with warnings denied
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Clippy
        run: |
          extra=()
          if [ -f Cargo.lock ]; then
            extra+=(--locked)
          fi
          cargo clippy --all-targets --all-features "${extra[@]}" -- -D warnings

  docs:
    name: rustdoc with warnings denied
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          extra=()
          if [ -f Cargo.lock ]; then
            extra+=(--locked)
          fi
          cargo doc --all-features --no-deps "${extra[@]}"

  conventions:
    name: 500-line Rust file cap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check the 500-line file cap
        run: |
          if ! find . -name '*.rs' ! -path '*/target/*' ! -path '*/.git/*' \
            | grep -q .; then
            echo "No Rust files; skipping 500-line cap."
            exit 0
          fi
          over=$(find . -name '*.rs' ! -path '*/target/*' ! -path '*/.git/*' \
            -print0 | xargs -0 wc -l \
            | awk '$NF != "total" && $1 > 500 { print $1 " " $2 }')
          if [ -n "${over}" ]; then
            echo "These files exceed the 500-line cap:"
            echo "${over}"
            exit 1
          fi
