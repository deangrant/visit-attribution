[package]
name = "visit-attribution"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Attribute GPS trajectory pings to point-of-interest visits"
license = "MIT"
readme = "README.md"
keywords = ["gps", "mobility", "visit", "attribution", "poi"]
categories = ["science", "algorithms"]
repository = "https://github.com/deangrant/visit-attribution"

[dependencies]

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "multi_stop"
path = "examples/multi_stop.rs"

[[example]]
name = "strip_mall"
path = "examples/strip_mall.rs"

[[example]]
name = "persist_model"
path = "examples/persist_model.rs"

[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
warnings = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"

[lints.rustdoc]
all = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Tests return `Result` so they can use `?` instead of `unwrap`; `assert!` stays.
panic_in_result_fn = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
multiple_crate_versions = "allow"
cognitive_complexity = "deny"
