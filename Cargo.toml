[package]
name = "visit-attribution"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Attribute GPS trajectory pings to point-of-interest visits"
license = "MIT"
readme = "README.md"
keywords = ["gps", "mobility", "visit", "attribution", "poi"]
categories = ["science", "algorithms"]
repository = "https://github.com/deangrant/visit-attribution"

[dependencies]

[[example]]
name = "basic"
path = "examples/basic.rs"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
return_self_not_must_use = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
